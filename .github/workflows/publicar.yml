name: Publicar en Instagram

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, minuto 17 (UTC). GitHub puede retrasarlo unos minutos.
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar = solo prueba el token; publicar = publica lo aprobado y vencido"
        type: choice
        options: [verificar, publicar]
        default: verificar

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/publicar.py "${{ github.event.inputs.modo || 'publicar' }}"

      - name: Guardar estado del calendario
        if: always()
        run: |
          if ! git diff --quiet calendario.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendario.json
            git commit -m "Calendario: publicaciones marcadas como publicadas"
            git push
          fi
